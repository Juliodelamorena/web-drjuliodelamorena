# Publica la web en GitHub Pages con cada push a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la carpeta pública (sin herramientas, originales ni material de Instagram)
        run: |
          mkdir -p _sitio
          rsync -a --exclude '.git' --exclude '.github' --exclude 'herramientas' --exclude 'ig' --exclude '_sitio' --exclude 'netlify.toml' --exclude 'GUIA.md' --exclude 'README.md' ./ _sitio/
          touch _sitio/.nojekyll
          ls _sitio | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
